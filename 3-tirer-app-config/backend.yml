apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels: 
        app: backend 
    spec:
      containers:
        - name: backend-container
          image: nginx:latest
          ports: 
            - containerPort: 80
          env:
            - name: DB_HOST
              valueFrom: 
                ConfigMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom: 
                ConfigMapKeyRef:
                  name: backend-config
                  key: DB_PORT
      

---

apiVersion: v1 
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app : backend
  ports:
    - port: 80
      targetPort: 80
