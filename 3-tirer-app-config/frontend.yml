apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels: 
        app: frontend 
    spec:
      containers:
        - name: frontend-container
          image: nginx:latest
          ports: 
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://backend-service:80
      

---

apiVersion: v1 
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app : frontend
  ports:
    - port: 80
      targetPort: 80
      NodePort: 30007
